# Managed rollouts: Baseten's qualified configuration for this model and topology.
# Edit only BUCKET (marked EDIT below). Name the model when you push:
#   baseten model push --dir <this folder> --override-name <your model name> --wait
# Create the two secrets named under secrets first (README.md, "Deploy"). Any other
# change runs a configuration Baseten has not qualified.
model_name: managed-rollouts
description: BIS serving with trainer-published checkpoint updates.
resources:
  accelerator: B200:8
  cpu: '100'
  memory: 1700Gi
bis_llm:
  config:
    gpuTRTImage: baseten/dynamo-cache-aware-routing@sha256:d37df97ab2b230dabbb4c1c3434a8a9f1998492a0ff6caa5b26138385dabab6f
    model_name: deepseek-v4.1-flash-mxfp4
    checkpoint_name: deepseek-ai/DeepSeek-V4.1-Flash-1017
    tokenizer_limit_length: 262144
    services:
      frontend:
        kind: frontend
        replicas: 1
      router:
        kind: router
        replicas: 1
      worker:
        kind: worker
        env:
        - name: ADMIN_HOST
          value: 127.0.0.1
      planner:
        kind: planner
        replicas: 1
    served_model_name: deepseek-v4.1-flash-mxfp4
    arguments_as_json: true
    ignore_return_log_probs_for_worker: false
    chat_processor: deepseek_v41_flash
    reasoning_parser: deepseek_v41
    tool_call_parser: deepseek_v41
    reasoning_policy:
      allowed:
      - none
      - low
      - high
      - xhigh
      - max
      default: high
    default_thinking_enabled: true
    b10_vision_config:
      enabled: true
      encoding_mode: frontend_plan_worker_exec
      supported_multi_modal_types:
      - image_url
    engine_config:
      page_size: 256
      kv_event_block_size: 256
      trust_remote_code: true
      tp_size: 8
      ep_size: 8
      enable_return_routed_experts: true
      enable_hierarchical_cache: true
      hicache_ratio: 1.0
      hicache_write_policy: write_back
      mem_fraction_static: 0.8
      chunked_prefill_size: 16384
      context_length: 262144
    rl:
      model: deepseek-v4.1-flash-mxfp4
      nodes: 1
      gpus_per_node: 8
      environment:
        RAM_WEIGHT_RESERVE_GB: '192'
        INFERENCE_RL_TOPP_CAPTURE: '1'
        SPARSE_STAGE_RAM_GB: '160'
        WEIGHT_UPDATE_DECODE_BATCH_BYTES: '1073741824'
        SPARSE_STAGE_DISK_RESERVE_GB: '5'
        ARC_SKIP_ADLER: '0'
        BUCKET: <YOUR_BUCKET_URL>  # EDIT: s3://bucket/prefix or gs://bucket/prefix
        AWS_SECRET_NAME: rl_checkpoint_reader
        USE_BDN_PROXY: '1'
        BDN_PROXY_REQUIRED: '1'
        BDN_PROXY_CREDENTIAL_FILE: /secrets/rl_bdn_partition
      engine_environment:
        SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION: '0'
secrets:
  rl_checkpoint_reader: null
  rl_bdn_partition: null
